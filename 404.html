<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · TempWise</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#06111c;color:#e7f0f8;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    h1{font-size:clamp(28px,6vw,44px);margin:0 0 8px}
    p{color:#88a1b8;margin:0 0 22px}
    a{display:inline-block;padding:12px 20px;border-radius:12px;background:linear-gradient(90deg,#2fa8ff,#1fd1c4);color:#04121e;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>This zone doesn’t exist.</h1>
    <p>The page you asked for isn’t here.</p>
    <a id="home" href="/">Back to TempWise</a>
  </main>
  <script>
    // Works on both USER.github.io/REPO/ and a custom domain.
    (function(){
      var parts = location.pathname.split('/').filter(Boolean);
      var onPages = /\.github\.io$/i.test(location.hostname);
      document.getElementById('home').href = onPages && parts.length ? '/' + parts[0] + '/' : '/';
    })();
  </script>
</body>
</html>
